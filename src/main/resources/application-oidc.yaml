server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            scope: openid, profile, email, roles
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: http://localhost:8081/realms/osu/protocol/openid-connect/auth
            token-uri: http://keycloak:8080/realms/osu/protocol/openid-connect/token
            jwk-set-uri: http://keycloak:8080/realms/osu/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/osu/protocol/openid-connect/certs